name: order-service
description: Order lifecycle events

clusters:
  production: prod-eu-west
  staging: staging-eu
  development: dev-local

topics:
  - name: order.created
    partitions: 12
    retention: 7d
    replication: 3
    visibility: domain # domain or internal(for internal use only)
    schema: order-created-v1.avsc
    consumers:
      - app: payment-service
        team: payment-processing
